apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
group = 'expo.modules.moneynotifications'
version = '1.0.0'
android {
  namespace 'expo.modules.moneynotifications'
  sourceSets { test.java.srcDirs += ['../../../tests'] }
  defaultConfig { versionCode 1; versionName '1.0.0'; minSdkVersion 24 }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
