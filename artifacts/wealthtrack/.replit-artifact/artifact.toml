kind = "mobile"
previewPath = "/"
title = "WealthTrack - Personal Finance"
version = "1.0.0"
id = "artifacts/wealthtrack"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 21187

[services.development]
run = "pnpm --filter @workspace/wealthtrack run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wealthtrack", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/wealthtrack", "run", "serve" ]

[services.env]
PORT = "21187"
BASE_PATH = "/"
