name: Publish completed APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-built-apk.yml']
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful APK compilation run containing Pro-Financer-Android-APK artifact
        required: true
        default: '37592490196'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUILD_RUN_ID: ${{ inputs.build_run_id || '37592490196' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify compilation succeeded
        run: |
          result=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}/jobs" --jq '.jobs[].steps[] | select(.name == "Build standalone APK for old and new ARM phones") | .conclusion')
          test "$result" = success
          source_commit=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}" --jq .head_sha)
          changes=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${source_commit}...${GITHUB_SHA}" --jq '.files[] | select(.filename != "README.md" and (.filename | startswith(".github/workflows/") | not)) | .filename')
          test -z "$changes"
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=android-build-${BUILD_RUN_ID}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: Pro-Financer-Android-APK
          path: apk-download
          run-id: ${{ env.BUILD_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Verify checksum and publish download
        run: |
          sha256sum -c apk-download/SHA256SUMS.txt
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Pro Financer Android APK" --notes "Standalone personal test APK, with automatic payment capture, distinct incoming/outgoing sounds and income naming. Enable capture and notification access in Activity. Uses Android public test signing key. Supabase Google login needs project configuration. Actual phone testing is required." --prerelease --latest=false
          fi
          gh release upload "$RELEASE_TAG" apk-download/Pro-Financer.apk apk-download/SHA256SUMS.txt --clobber
